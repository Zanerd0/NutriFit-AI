services:
  backend:
    build: ./backend
    container_name: nutrifit_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app # This syncs your code so you don't have to rebuild on every save
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: nutrifit_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend